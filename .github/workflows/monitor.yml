name: Cloud Health Check & Telemetry

on:
  schedule:
    # Executes automatically every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  telemetry-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monitoring Script
        run: |
          python monitor.py

      - name: Commit and Push Updated Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uptime_logs.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): update uptime logs [skip ci]" && git push)
